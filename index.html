<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>
<body>
  <main class="page">
    <article class="card">
      <img  class="main-img" src="images/illustration-hero.svg" alt="">

      <div class="content">
        
        <h1 class="title">Order Summary</h1>

        <p class="description">
          You can now listen to millions of songs, audiobooks, and podcasts on any 
          device anywhere you like!
        </p>
        
        <div class="payment-plan">
          <div class="annual-plan-icon">
            <img src="images/icon-music.svg" alt="" aria-hidden="true">

            <div class="annual-plan">
              <strong>Annual Plan</strong>
              <span class="price">$59.99/year</span> 
            </div>
          </div>  
          <a class="change-link" href="#">Change</a> 
        </div>

        <button class="payment-button" type="button">Proceed to Payment</button> 
        <a class="cancel-link" href="#">Cancel Order</a>  

      </div>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/ahmedattlam10">ahmed.attlam</a>.
  </footer>
</body>
</html>
